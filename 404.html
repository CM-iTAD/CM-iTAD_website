<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CM-iTAD Lab has moved</title>
<link rel="canonical" href="https://cm-itad.github.io/">
<meta name="robots" content="noindex, follow">
<script>
/* Preserve the deep path: /website/publications.html -> /publications.html
   This file is served as BOTH index.html and 404.html, so it catches every
   path under the old project-site prefix, not just the root. */
(function () {
  var dest = "https://cm-itad.github.io/";
  var rest = location.pathname.replace(/^\/+(CM-iTAD_website|website)\/?/i, "");
  location.replace(dest + rest + location.search + location.hash);
})();
</script>
<meta http-equiv="refresh" content="0; url=https://cm-itad.github.io/">
<style>
  body{margin:0;background:#F3F6FA;color:#11243B;
       font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;

  .b{max-width:52ch;text-align:center}
  p.k{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;
      letter-spacing:.16em;text-transform:uppercase;color:#1D70B3;margin:0 0 14px}
  h1{font-size:clamp(26px,4vw,38px);font-weight:600;letter-spacing:-.02em;margin:0 0 14px}
  p{font-size:17px;line-height:1.6;color:#46586D;margin:0 0 22px}
  a{display:inline-flex;align-items:center;min-height:44px;padding:11px 20px;

</style>
